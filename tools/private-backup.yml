# Vorlage für das private Backup-Repo (Daten nicht öffentlich, siehe docs/INSTALLATION.md).
# In das private Repo als .github/workflows/backup.yml legen. Dort eintragen:
#   Variable APP_REPO               = Repo der Seite, z. B. name/soul-link (Settings > Secrets and variables > Actions > Variables)
#   Secret   FIREBASE_SERVICE_ACCOUNT = Inhalt der JSON-Schlüsseldatei (Firebase > Projekteinstellungen > Dienstkonten)
# Holt tools/backup.py und config.js aus dem Repo der Seite, liest Firestore mit dem Dienstkonto
# und committet nach backups/ in diesem privaten Repo. Von Hand: Actions > "Backup" > "Run workflow".
name: Backup

on:
  schedule:
    - cron: "17 3 * * *"   # täglich 03:17 UTC (04:17 / 05:17 deutscher Zeit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Skript aus dem Repo der Seite holen
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          path: app

      - name: Daten aus Firestore sichern
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DIR: backups
        run: python3 app/tools/backup.py

      - name: Committen, falls sich etwas geändert hat
        run: |
          git add backups
          if git diff --cached --quiet; then
            echo "Nichts zu committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
